services:
  # Laravel Application (from Docker Hub)
  app:
    image: vanny3333/km-help-desk:latest
    container_name: km-help-desk-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - km-help-desk-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-kimmix_cms}
      - DB_USERNAME=${DB_USERNAME:-kimmix_user}
      - DB_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: km-help-desk-nginx
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - km-help-desk-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: km-help-desk-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-kimmix_cms}
      - MYSQL_USER=${DB_USERNAME:-kimmix_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - km-help-desk-network

  # Redis Cache & Queue
  redis:
    image: redis:alpine
    container_name: km-help-desk-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - km-help-desk-network
    command: redis-server --appendonly yes

  # Queue Worker
  queue:
    image: vanny3333/km-help-desk:latest
    container_name: km-help-desk-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    networks:
      - km-help-desk-network
    depends_on:
      - redis
      - db
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-kimmix_cms}
      - DB_USERNAME=${DB_USERNAME:-kimmix_user}
      - DB_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis

  # Scheduler (Cron)
  scheduler:
    image: vanny3333/km-help-desk:latest
    container_name: km-help-desk-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    networks:
      - km-help-desk-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-kimmix_cms}
      - DB_USERNAME=${DB_USERNAME:-kimmix_user}
      - DB_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - REDIS_HOST=redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  km-help-desk-network:
    driver: bridge
