services:
  # Redis (for caching and queues)
  redis:
    image: redis:7-alpine
    container_name: kimmix-cms-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - kimmix-network
    command: redis-server --appendonly yes

volumes:
  redis_data:
    driver: local

networks:
  kimmix-network:
    driver: bridge
