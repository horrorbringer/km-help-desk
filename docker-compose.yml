version: '3.8'

services:
  # PHP-FPM Service (Laravel Application)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimmix-cms-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - kimmix-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-kimmix_cms}
      - DB_USERNAME=${DB_USERNAME:-kimmix_user}
      - DB_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: kimmix-cms-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kimmix-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: kimmix-cms-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-kimmix_cms}
      - MYSQL_USER=${DB_USERNAME:-kimmix_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
    networks:
      - kimmix-network

  # Redis (for caching and queues)
  redis:
    image: redis:7-alpine
    container_name: kimmix-cms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kimmix-network
    command: redis-server --appendonly yes

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimmix-cms-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - kimmix-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-kimmix_cms}
      - DB_USERNAME=${DB_USERNAME:-kimmix_user}
      - DB_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    command: php artisan queue:work --tries=3 --timeout=90

  # Scheduler (Cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimmix-cms-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - kimmix-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-kimmix_cms}
      - DB_USERNAME=${DB_USERNAME:-kimmix_user}
      - DB_PASSWORD=${DB_PASSWORD:-kimmix_password}
      - REDIS_HOST=redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  kimmix-network:
    driver: bridge
